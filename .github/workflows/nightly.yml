# Nightly at 03:00 UK summer time (02:00 UTC): the bench on each of the owner's machines that has a
# runner, with an issue if any bench model got more than 3% slower (spec P2, P8). Weekly (Sundays):
# a CUDA build-only check on GitHub's Linux machines, weekly rather than nightly to save the free
# minutes (D-011). Scheduled runs use the workflow on main, so this starts once M0 is merged.
name: nightly

on:
  schedule:
    - cron: '0 2 * * *'    # the bench, nightly
    - cron: '30 2 * * 0'   # the CUDA build, Sundays
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  # A runner exists once the owner installs one; until then each job is skipped. The owner (or a
  # session with the rights) sets the repository variable, e.g. KERA_RUNNER_AMD = true.
  bench-amd:
    if: vars.KERA_RUNNER_AMD == 'true' && github.event.schedule != '30 2 * * 0'
    uses: ./.github/workflows/bench-runner.yml
    with: { runner: amd, label: nightly, open_issue: true }

  bench-mac:
    if: vars.KERA_RUNNER_MAC == 'true' && github.event.schedule != '30 2 * * 0'
    uses: ./.github/workflows/bench-runner.yml
    with: { runner: mac, label: nightly, open_issue: true }

  bench-nvidia:
    if: vars.KERA_RUNNER_NVIDIA == 'true' && github.event.schedule != '30 2 * * 0'
    uses: ./.github/workflows/bench-runner.yml
    with: { runner: nvidia, label: nightly, open_issue: true }

  cuda-build:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 2 * * 0'
    runs-on: ubuntu-24.04
    container: nvidia/cuda:12.6.2-devel-ubuntu24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - name: Install tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y cmake build-essential ninja-build git ccache

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.24
        with:
          key: kera-cuda-weekly
          evict-old-files: 8d

      # one GPU generation (Ada, RTX 40) for now; add the DGX Spark's (sm_121) with a CUDA 12.9+ image
      # once there is a Spark to run it on
      - name: Build (CUDA, build only)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF -DGGML_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=89-real \
            -DGGML_CUDA_CCCL_VERSION=v3.4.3 \
            -DCMAKE_EXE_LINKER_FLAGS=-Wl,--allow-shlib-undefined \
            -DLLAMA_OPENSSL=OFF -DKERA_BUILD_TESTS=OFF -DKERA_WARNINGS_AS_ERRORS=ON -DKERA_IMAGE=OFF -DKERA_MUSIC=OFF -DKERA_3D=OFF -DKERA_SFX=OFF
          cmake --build build -j "$(nproc)"

  report:
    needs: [bench-amd, bench-mac, bench-nvidia, cuda-build]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - name: Open an issue for a broken nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create -R "$GITHUB_REPOSITORY" --label bug \
            --title "Nightly run failed" \
            --body "A nightly job failed (the CUDA build, or a bench on one of the owner's machines): $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
