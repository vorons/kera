# Every push: the Linux CPU build, unit tests, reference-code tests, the tiny-model exactness test
# (spec P2) and an app smoke test.
# Windows and Mac builds cost 2x and about 10x the free minutes, so they run when a commit message
# contains [win] or [mac], and for every release (release.yml). See docs/DECISIONS.md D-011.
name: ci

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      # the runner comes with about 14 GB free; the speech and music models (4.8 GB), the image and vision ones
      # (2.3 GB) and three engines' builds need more: drop SDKs this job doesn't use (about 20 GB)
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift
          df -h /

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tests/tiny_models/requirements.txt

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1
          python -m pip install -r tests/tiny_models/requirements.txt -r tools/finetune/requirements.txt pytest

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.24
        with:
          key: kera-linux-ci
          evict-old-files: 1d

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DLLAMA_OPENSSL=OFF -DKERA_WARNINGS_AS_ERRORS=ON
          cmake --build build -j $(nproc)

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Reference-code tests
        run: python -m pytest -q tests/python

      - name: Tiny-model exactness (spec P2)
        run: python tests/tiny_models/run_exactness.py --kera build/bin/kera --work "$RUNNER_TEMP/tiny"

      - name: Streamed experts give the same answers (spec Phase 2)
        run: python tests/integration/test_stream_exact.py --kera build/bin/kera --models "$RUNNER_TEMP/tiny"

      - name: Saved chats survive a restart (spec 4b)
        run: |
          python tests/integration/test_kv_store.py --kera build/bin/kera --model "$RUNNER_TEMP/tiny/nemotron_h_moe.gguf"
          python tests/integration/test_kv_store.py --kera build/bin/kera --model "$RUNNER_TEMP/tiny/deepseek_v3_mla.gguf" --words 30 --port 8418
          # the batched copy a graphics chip uses for saving and loading state (N-005), forced on for the CPU's tensors
          KERA_IO_SPAN_TEST=1 python tests/integration/test_kv_store.py --kera build/bin/kera --model "$RUNNER_TEMP/tiny/nemotron_h_moe.gguf" --port 8419

      - name: The model card's sampling per request (spec 4c item 2)
        run: |
          python tests/integration/test_model_defaults.py --kera build/bin/kera --model "$RUNNER_TEMP/tiny/nemotron_h_moe.gguf" --qwen-model "$RUNNER_TEMP/tiny/qwen3_dense.gguf"
          # models from Ollama's store run with their Modelfile, never in a chat format they weren't trained on (D-033)
          python tests/integration/test_ollama_models.py --kera build/bin/kera --model "$RUNNER_TEMP/tiny/qwen3_dense.gguf"

      - name: Guessing keeps the output exact, streamed too (spec 11.1, Gate 6 (a))
        run: |
          python tests/integration/test_guess_controller.py --kera build/bin/kera --model "$RUNNER_TEMP/tiny/deepseek_v3_mla.gguf"
          python tests/integration/test_guess_controller.py --kera build/bin/kera --model "$RUNNER_TEMP/tiny/glm_moe_dsa_mtp.gguf" --mtp --port 8450

      - name: Several chats at once (D-023)
        run: |
          python tests/integration/test_multi_user.py --kera build/bin/kera --model "$RUNNER_TEMP/tiny/qwen3_dense.gguf"
          python tests/integration/test_multi_user.py --kera build/bin/kera --model "$RUNNER_TEMP/tiny/nemotron_h_moe.gguf" --port 8580
          python tests/integration/test_multi_user.py --kera build/bin/kera --model "$RUNNER_TEMP/tiny/glm_moe_dsa_mtp.gguf" --guess --no-sharing --port 8590

      - name: Each message on the back-end that finishes it sooner (D-024)
        run: |
          python tests/integration/test_backend_route.py --kera build/bin/kera --model "$RUNNER_TEMP/tiny/qwen3_dense.gguf"
          python tests/integration/test_backend_route.py --kera build/bin/kera --model "$RUNNER_TEMP/tiny/nemotron_h_moe.gguf" --port 8640

      # the small real models the vision and image tests use (280 MB and 2 GB), downloaded once and kept
      - name: Test models
        uses: actions/cache@v5
        with:
          path: ~/.cache/kera-test-models
          key: kera-test-models-smolvlm256m-sdturbo-q8-qwen25-05b

      - name: Models that see images (D-027)
        run: python tests/integration/test_vision.py --kera build/bin/kera --models ~/.cache/kera-test-models

      - name: Models that make images (D-027)
        run: python tests/integration/test_image.py --kera build/bin/kera --models ~/.cache/kera-test-models

      # rule one (D-033): kera serve with no options against llama.cpp's own server with no options, on the vision
      # test's small real chat model, guessed words included; and the makers' picture and video settings
      - name: At its defaults, Kera answers as stock llama.cpp does (D-033)
        run: |
          cmake --build build --target llama-server -j $(nproc)   # llama.cpp's own server isn't part of Kera's build
          python tests/integration/test_stock_defaults.py --kera build/bin/kera --llama-server build/bin/llama-server --model ~/.cache/kera-test-models/SmolVLM-256M-Instruct-Q8_0.gguf
          python tests/integration/test_picture_settings.py --kera build/bin/kera
          python tools/recipes/make_table.py --check

      # the makers' own default sampling from the built-in list (D-036), on Qwen's own small GGUF file (490 MB),
      # which carries none of its own
      - name: A chat model's own settings from the built-in list (D-036)
        run: |
          python tools/cards/make_table.py --check
          python tools/publish/models_list.py --check
          f=~/.cache/kera-test-models/qwen2.5-0.5b-instruct-q4_k_m.gguf
          test -s "$f" || curl -sSfL --retry 3 -o "$f" https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf
          python tests/integration/test_model_defaults.py --kera build/bin/kera --model "$RUNNER_TEMP/tiny/nemotron_h_moe.gguf" --listed-model "$f" --port 8470

      # speech and music: Qwen3-TTS 1.7B and ACE-Step 1.5's smallest set (4.8 GB), kept in a cache of their own
      - name: Speech and music models
        uses: actions/cache@v5
        with:
          path: ~/.cache/kera-media-models
          key: kera-media-models-qwen3tts17b-q4-acestep15-turbo-q4

      - name: Speech, music and video (D-028)
        run: python tests/integration/test_media.py --kera build/bin/kera --models ~/.cache/kera-media-models

      # their weights are 4 GB and more (and 3D needs a graphics chip): the commands, the engines and the messages
      - name: 3D models and sound effects (D-031)
        run: python tests/integration/test_3d_sfx.py --kera build/bin/kera

      - name: Fine-tuning end to end (spec Phase 10)
        run: |
          python tests/integration/test_finetune.py --kera build/bin/kera --hf "$RUNNER_TEMP/tiny/qwen3_dense" --gguf "$RUNNER_TEMP/tiny/qwen3_dense.gguf"
          python tests/integration/test_finetune.py --kera build/bin/kera --hf "$RUNNER_TEMP/tiny/deepseek_v3_mla" --gguf "$RUNNER_TEMP/tiny/deepseek_v3_mla.gguf" --esft --port 8530

      - name: Bench smoke test (section 7)
        run: |
          export KERA_HOME="$RUNNER_TEMP/kera-bench"
          ./build/bin/kera bench --model "$RUNNER_TEMP/tiny/nemotron_h_moe.gguf" --runs 1 --n-gen 8 --out "$RUNNER_TEMP/bench.json"
          python -c "import json,sys; j=json.load(open(sys.argv[1])); r=j['results']; assert len(r)==4 and all(x['decode_tok_s']>0 and x['ttft_ms']>0 for x in r) and j['model']['hash'].startswith('xxh128:'), j" "$RUNNER_TEMP/bench.json"

      - name: App smoke test
        run: |
          export KERA_HOME="$RUNNER_TEMP/kera"
          ./build/bin/kera setup --quick
          ./build/bin/kera app --no-browser --port 8341 & pid=$!
          sleep 3
          curl -sf http://127.0.0.1:8341/api/status | python3 -c "import json,sys; j=json.load(sys.stdin); assert j['profile']; print('\n'.join(j['explain']))"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example:8341' http://127.0.0.1:8341/api/status)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8341/api/setup)" = 403
          kill $pid

      - name: The app keeps a model loaded (spec 4c item 1)
        run: python tests/integration/test_app_run.py --kera build/bin/kera --models "$RUNNER_TEMP/tiny"

      - name: Web page type check
        run: npx --yes -p typescript@5.9.3 tsc --noEmit --allowJs --checkJs --strict --target es2022 --lib es2022,dom app/web/app.js

  windows:
    if: contains(github.event.head_commit.message, '[win]') || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/build-windows.yml
    with:
      package: true
      version: dev

  macos:
    if: contains(github.event.head_commit.message, '[mac]')
    uses: ./.github/workflows/build-macos.yml
    with:
      package: true
      version: dev

  # the DGX Spark (D-029), only with [spark] in the message: the ARM64 CUDA download's build, and Kera on an ARM
  # CPU like the Spark's (the tiny models exact, saved chats, guessing), since there is no Spark to run on
  spark:
    if: contains(github.event.head_commit.message, '[spark]') && !contains(github.event.head_commit.message, '[release v')
    uses: ./.github/workflows/build-linux-arm64-cuda.yml
    with:
      package: true
      version: dev

  linux-arm:
    if: contains(github.event.head_commit.message, '[spark]')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tests/tiny_models/requirements.txt

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1
          python -m pip install -r tests/tiny_models/requirements.txt pytest

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.24
        with:
          key: kera-linux-arm-ci
          evict-old-files: 1d

      - name: Build (CPU only)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DLLAMA_OPENSSL=OFF \
            -DKERA_WARNINGS_AS_ERRORS=ON -DKERA_IMAGE=OFF -DKERA_MUSIC=OFF -DKERA_3D=OFF -DKERA_SFX=OFF
          cmake --build build -j $(nproc)

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Tiny-model exactness on ARM (spec P2)
        run: python tests/tiny_models/run_exactness.py --kera build/bin/kera --work "$RUNNER_TEMP/tiny"

      - name: Streamed experts give the same answers on ARM
        run: python tests/integration/test_stream_exact.py --kera build/bin/kera --models "$RUNNER_TEMP/tiny"

      - name: Saved chats and guessing on ARM
        run: |
          python tests/integration/test_kv_store.py --kera build/bin/kera --model "$RUNNER_TEMP/tiny/nemotron_h_moe.gguf"
          python tests/integration/test_guess_controller.py --kera build/bin/kera --model "$RUNNER_TEMP/tiny/deepseek_v3_mla.gguf"


  # the optional ROCm (HIP) add-on for the Minisforum (about 40 minutes, Windows): only with [hip] in the message,
  # and not for a "[release ...]" commit, whose release builds it anyway (D-011: keep the free minutes)
  windows-hip:
    if: contains(github.event.head_commit.message, '[hip]') && !contains(github.event.head_commit.message, '[release v')
    uses: ./.github/workflows/build-windows-hip.yml