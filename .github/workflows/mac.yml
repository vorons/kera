# The Mac build and tests, on demand. The spec's nightly Mac job is for a `mac` runner on the owner's
# MacBook, which costs no minutes; on GitHub's own Mac machines (about 10x the minutes) it would use up
# the free allowance in days, so it only runs when started by hand or for a release (D-011).
name: mac

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    uses: ./.github/workflows/build-macos.yml
    with:
      package: true
      version: dev
